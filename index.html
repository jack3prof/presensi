<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESENSI DK3</title>

    <!-- Library Scanner QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        /* =========================
           RESET & BASIC
        ========================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Roboto, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */
        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #1565c0;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
        }

        /* =========================
           CONTAINER & CARD
        ========================= */
        .container {
            max-width: 600px;
            margin: auto;
            padding: 12px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
        }

        /* =========================
           SCANNER AREA
        ========================= */
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed #cbd5e1;
            background: #f8fafc;
        }

        .scan-status {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #1565c0;
        }

        /* =========================
           SEARCH & INPUT
        ========================= */
        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            margin-bottom: 14px;
            outline: none;
        }

        input:focus {
            border-color: #1565c0;
            box-shadow: 0 0 0 2px rgba(21, 101, 192, .15);
        }

        .search {
            margin-bottom: 10px;
        }

        /* =========================
           TABLE
        ========================= */
        .table-wrap {
            overflow: auto;
            max-height: 400px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 5;
        }

        th {
            background: #1565c0;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        /* =========================
           LOADING & SNACKBAR
        ========================= */
        .loading {
            display: none;
            text-align: center;
            padding: 15px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 4px solid #ddd;
            border-top-color: #1565c0;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .snackbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            display: none;
            z-index: 100;
            font-size: 14px;
            text-align: center;
        }

        /* =========================
           DARK MODE
        ========================= */
        @media(prefers-color-scheme:dark) {
            body {
                background: #0f172a;
                color: white;
            }

            .card {
                background: #1e293b;
            }

            #reader {
                background: #0f172a;
                border-color: #475569;
            }

            input {
                background: #334155;
                color: white;
                border-color: #475569;
            }

            td {
                color: white;
            }

            tr:nth-child(even) {
                background: #334155;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        PRESENSI DK3
    </div>

    <div class="container">

        <!-- CAMERA SCANNER CARD -->
        <div class="card">
            <div id="reader"></div>
            <div id="scanStatus" class="scan-status">Arahkan kamera ke QR Code...</div>
        </div>

        <!-- DATA TABLE CARD -->
        <div class="card">
            <input class="search" id="cari" type="text" placeholder="🔍 Cari QRcode atau Waktu Input" oninput="filterData()">

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Memuat data...</p>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>QRcode</th>
                            <th>Waktu Input</th>
                        </tr>
                    </thead>
                    <tbody id="tabelData"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SNACKBAR -->
    <div class="snackbar" id="snackbar"></div>

    <script>
        // =========================
        // KONFIGURASI API
        // =========================
        const API = "https://script.google.com/macros/s/AKfycbzkXuFDaEbVXgxNeumxh3Ytab_4TaQgrasX2EzewUCgu8ckGL5gaKnDM8rRVaNurhtQ/exec";

        let semuaData = [];
        let isProcessing = false;
        let html5QrcodeScanner;

        // =========================
        // INITIALIZATION
        // =========================
        document.addEventListener("DOMContentLoaded", function () {
            loadData();
            initScanner();
        });

        // =========================
        // FORMAT WAKTU (dd mmm yy ; hh:mm)
        // =========================
        function formatWaktuCustom(dateString) {
            if (!dateString || dateString === "-") return "-";

            let date = new Date(dateString);

            // Menangani format tanggal string non-ISO atau dari spreadsheet lokal
            if (isNaN(date.getTime()) && typeof dateString === 'string') {
                date = new Date(dateString.replace(/-/g, "/"));
            }

            if (isNaN(date.getTime())) return dateString;

            const bulanIndo = [
                "Jan", "Feb", "Mar", "Apr", "Mei", "Jun",
                "Jul", "Agu", "Sep", "Okt", "Nov", "Des"
            ];

            const day = String(date.getDate()).padStart(2, '0');
            const month = bulanIndo[date.getMonth()];
            const year = String(date.getFullYear()).slice(-2);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');

            return `${day} ${month} ${year} ; ${hours}:${minutes}`;
        }

        // =========================
        // SCANNER QR CODE SETUP
        // =========================
        function initScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                rememberLastUsedCamera: true
            });

            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        async function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            const cleanQR = decodedText.trim();
            document.getElementById("scanStatus").innerText = "Mengecek & Menyimpan: " + cleanQR;

            // 1. Cek Duplikasi di Data Lokal
            const isExist = semuaData.some(item => 
                (item.qrcode || item.pengguna || "").toString().trim().toUpperCase() === cleanQR.toUpperCase()
            );

            if (isExist) {
                snackbar("❌ QR Code sudah pernah terdaftar!");
                resetScanDelay();
                return;
            }

            // Lock instant di array lokal agar scan beruntun <1 detik langsung ditolak
            semuaData.unshift({
                qrcode: cleanQR,
                waktu: new Date().toISOString()
            });
            tampilTabel(semuaData);

            // 2. Kirim Data ke Google Apps Script
            await simpanQrCode(cleanQR);
        }

        function onScanFailure(error) {
            // Abaikan kegagalan baca frame
        }

        function resetScanDelay() {
            setTimeout(() => {
                isProcessing = false;
                document.getElementById("scanStatus").innerText = "Arahkan kamera ke QR Code...";
            }, 2000);
        }

        // =========================
        // AMBIL DATA FROM SERVER
        // =========================
        async function loadData() {
            tampilLoading(true);

            try {
                const response = await fetch(API + "?action=list");
                semuaData = await response.json();
                tampilTabel(semuaData);
            } catch (e) {
                snackbar("Gagal mengambil data");
                console.error(e);
            }

            tampilLoading(false);
        }

        // =========================
        // SIMPAN QR CODE KE SERVER
        // =========================
        async function simpanQrCode(qrResult) {
            try {
                const params = new URLSearchParams({
                    action: "simpan",
                    qrcode: qrResult,
                    waktu: new Date().toISOString()
                });

                let response = await fetch(`${API}?${params.toString()}`);
                let hasil = await response.json();

                if (hasil.success) {
                    snackbar("✅ Berhasil menyimpan QR: " + qrResult);
                    await loadData();
                } else {
                    snackbar("❌ " + (hasil.message || "Gagal menyimpan QR Code"));
                    await loadData();
                }

            } catch (e) {
                snackbar("Server tidak merespon");
                console.error(e);
                await loadData();
            }

            resetScanDelay();
        }

        // =========================
        // TAMPIL TABEL
        // =========================
        function tampilTabel(data) {
            let html = "";

            if (!Array.isArray(data) || data.length === 0) {
                html = `
                <tr>
                    <td colspan="2" style="text-align:center">Tidak ada data</td>
                </tr>`;
            } else {
                data.forEach(function (r) {
                    let qrcode = aman(r.qrcode || r.pengguna || "");
                    let rawWaktu = r.waktu || r.timestamp || r.konfirmasi || "-";
                    let waktuFormatted = aman(formatWaktuCustom(rawWaktu));

                    html += `
                    <tr>
                        <td><b>${qrcode}</b></td>
                        <td>${waktuFormatted}</td>
                    </tr>`;
                });
            }

            document.getElementById("tabelData").innerHTML = html;
        }

        // =========================
        // FILTER PENCARIAN
        // =========================
        function filterData() {
            let keyword = document.getElementById("cari").value.toLowerCase();

            let hasil = semuaData.filter(function (r) {
                let qrcode = (r.qrcode || r.pengguna || "").toLowerCase();
                let rawWaktu = r.waktu || r.timestamp || r.konfirmasi || "";
                let waktuFormatted = formatWaktuCustom(rawWaktu).toLowerCase();

                return (
                    qrcode.includes(keyword) ||
                    waktuFormatted.includes(keyword)
                );
            });

            tampilTabel(hasil);
        }

        // =========================
        // UTILITAS
        // =========================
        function tampilLoading(status) {
            document.getElementById("loading").style.display = status ? "block" : "none";
        }

        function snackbar(text) {
            let s = document.getElementById("snackbar");
            s.innerHTML = text;
            s.style.display = "block";

            setTimeout(function () {
                s.style.display = "none";
            }, 3000);
        }

        function aman(text) {
            if (!text) return "";
            return text
                .toString()
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }
    </script>
</body>

</html>
